      - /data/rerank/protenix/chembl_bdb/sample_30w/triplet/sample_30w_triplet_3.lmdb
      - /data/rerank/protenix/chembl_bdb/sample_30w/triplet/sample_30w_triplet_4.lmdb
      - /data/rerank/protenix/chembl_bdb/sample_30w/triplet/sample_30w_triplet_5.lmdb
      - /data/rerank/protenix/chembl_bdb/sample_30w/triplet/sample_30w_triplet_6.lmdb
      - /data/rerank/protenix/chembl_bdb/sample_30w/triplet/sample_30w_triplet_7.lmdb
      - /data/rerank/protenix/chembl_bdb/sample_30w/triplet/sample_30w_triplet_8.lmdb
      - /data/rerank/protenix/chembl_bdb/sample_30w/triplet/sample_30w_triplet_9.lmdb

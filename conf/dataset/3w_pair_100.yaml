_target_: protenix.data.pair_dataset.DataModule
num_workers: 32
pin_memory: True
batch_size: 1024
dataset_args:
  train:
    _target_: protenix.data.pair_dataset.FullReducePairDataset
    meta_path: /data/rerank/protenix/chembl_bdb/chembl_bdb_meta.lmdb
    meta_split: train_3w_100
    feat_lmdb_path:
      
    feat_split: full_pair
    include_screen: true
    max_screen: null
    include_rerank: true
    max_rerank: null
  val:
    _target_: protenix.data.pair_dataset.FullReducePairDataset
    meta_path: /data/rerank/protenix/chembl_bdb/chembl_bdb_meta.lmdb
    meta_split: val_5k
    feat_lmdb_path:
      - /data/rerank/protenix/chembl_bdb/sample_val/sample_val_pair_v2.lmdb
    feat_split: full_pair
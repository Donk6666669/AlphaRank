# @package _global_
name: ic50_base
notes: "Training on SIU KI data"

defaults:
  - override /dataset: siu_ic50
  - override /callbacks: [checkpoint_ki, lr_monitor, rich, summary]

trainer:
  devices: 4

model:
  args:
    tasks: ["single_ic50"]
    agg_strategy: simple

criterion:
  tasks: ["single_ki", "single_kd", "single_ic50"]

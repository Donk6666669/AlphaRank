# @package _global_
name: 3w_pair_combine
notes: "Training on 3w pair data"

defaults:
  - override /dataset: 3w_pair_ori
  - override /model: combine_pair_ranker
  - override /criterion: rank
  - override /callbacks: [checkpoint_screen, lr_monitor, rich, summary]

dataset:
  dataset_args:
    train:
      include_screen: true
      max_screen: null
      include_rerank: false
      max_rerank: null

optim:
  lr: 1e-4